name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            profile: core
          - os: windows-latest
            python: '3.13'
            profile: core
          - os: ubuntu-latest
            python: '3.13'
            profile: full
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements-*.txt
            backend/constraints-ci.txt
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - name: Check ripgrep
        run: rg --version
      - name: Install core dependencies
        run: python -m pip install -r requirements-research.txt -c constraints-ci.txt
      - name: Install optional analysis dependencies and CPU PyTorch
        if: matrix.profile == 'full'
        run: |
          python -m pip install -r requirements-analysis.txt -c constraints-ci.txt
          python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
          python -c "import scipy, openpyxl, torch"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run offline tests
        run: python -m pytest tests -q --junitxml=test-results/pytest.xml
      - name: Test missing-ripgrep fallback
        if: matrix.profile == 'core' && runner.os == 'Linux'
        run: python -m pytest tests -q --without-rg --junitxml=test-results/without-rg.xml
      - name: Record installed versions
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          directory = Path('test-results')
          directory.mkdir(exist_ok=True)
          with (directory / 'environment.txt').open('w', encoding='utf-8') as output:
              output.write(sys.version + '\n')
              output.flush()
              subprocess.run([sys.executable, '-m', 'pip', 'freeze'], stdout=output, check=True)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.profile }}
          path: backend/test-results/
          retention-days: 14

  frontend:
    name: Frontend / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck:research
      - run: npm run build
