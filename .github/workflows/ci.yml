name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            profile: core
          - os: windows-latest
            python: '3.13'
            profile: core
          - os: ubuntu-latest
            python: '3.13'
            profile: full
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements-*.txt
            backend/constraints-ci.txt
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - name: Check ripgrep
        run: rg --version
      - name: Install core dependencies
        run: python -m pip install -r requirements-research.txt -c constraints-ci.txt
      - name: Install optional analysis dependencies and CPU PyTorch
        if: matrix.profile == 'full'
        run: |
          python -m pip install -r requirements-analysis.txt -c constraints-ci.txt
          python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
          python -c "import scipy, openpyxl, torch"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run offline tests
        run: python -m pytest tests -q --junitxml=test-results/pytest.xml
      - name: Export Agent fault matrix
        run: python ../scripts/eval_agent_faults.py --out test-results/agent-faults
      - name: Audit saved failure context without model calls
        run: python ../scripts/diagnose_agent_context.py --out test-results/context-audit.json
      - name: Audit published verifier pilot
        run: python ../scripts/audit_verifier_pilot.py
      - name: Audit repair study and cached gate comparison
        run: python ../scripts/audit_repair_study.py
      - name: Audit natural report calibration and pending human labels
        run: python ../scripts/audit_report_calibration.py
      - name: Audit scale study and interrupted attempt
        run: |
          python ../scripts/audit_verifier_scale.py
          python ../scripts/audit_verifier_scale.py --root ../docs/results/scifact-verifier-scale-v2/interrupted-run-001
      - name: Independently reproduce scale study intervals
        if: matrix.profile == 'full'
        run: python ../scripts/audit_verifier_scale.py --bootstrap
      - name: Audit label intervention, frozen gold views and calibration thresholds
        run: python ../scripts/audit_verifier_labels.py
      - name: Independently reproduce label intervention intervals
        if: matrix.profile == 'full'
        run: python ../scripts/audit_verifier_labels.py --bootstrap
      - name: Test missing-ripgrep fallback
        if: matrix.profile == 'core' && runner.os == 'Linux'
        run: python -m pytest tests -q --without-rg --junitxml=test-results/without-rg.xml
      - name: Record installed versions
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          directory = Path('test-results')
          directory.mkdir(exist_ok=True)
          with (directory / 'environment.txt').open('w', encoding='utf-8') as output:
              output.write(sys.version + '\n')
              output.flush()
              subprocess.run([sys.executable, '-m', 'pip', 'freeze'], stdout=output, check=True)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.profile }}
          path: backend/test-results/
          retention-days: 14

  frontend:
    name: Frontend / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:research
      - run: npm run build

  demo:
    name: Docker demo / import and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and start the local demo
        run: docker compose up --build --detach --wait
      - name: Check replay, paper import and authenticated tools without a model
        run: python scripts/smoke_demo.py
      - name: Check persisted configuration initialization
        run: docker compose run --rm config
      - name: Restart application containers
        run: |
          docker compose restart backend frontend
          docker compose up --detach --wait
      - name: Verify persisted papers after restart
        run: python scripts/smoke_demo.py --verify-state
      - name: Show container status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 50
      - name: Stop containers
        if: always()
        run: docker compose down
