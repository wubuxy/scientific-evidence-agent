<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">Scientific Evidence Agent — 科研证据助手</title>
  <desc id="desc">从论文检索到带引用的研究报告：Search, Read, Synthesize。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b32"/><stop offset="1" stop-color="#182c46"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#79e5d3"/><stop offset="1" stop-color="#a0b4ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b5cee9" stroke-opacity=".045"/></pattern>
    <style>text{font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC",sans-serif}.mono{font-family:Consolas,monospace}</style>
  </defs>
  <rect width="1600" height="440" rx="26" fill="url(#bg)"/>
  <rect width="1600" height="440" rx="26" fill="url(#grid)"/>
  <circle cx="1420" cy="70" r="240" fill="#496ee8" opacity=".07"/>
  <circle cx="1210" cy="420" r="240" fill="#38c7b0" opacity=".045"/>
  <rect x="65" y="61" width="6" height="29" rx="3" fill="url(#accent)"/>
  <text x="86" y="84" font-size="19" letter-spacing="3" font-weight="600" fill="#85d8d0">PAPER-GROUNDED RESEARCH</text>
  <text x="64" y="166" font-size="53" font-weight="700" fill="#f5f8ff">Scientific Evidence Agent</text>
  <text x="67" y="225" font-size="31" fill="#d1ddf0">从论文检索，到带引用的研究报告</text>
  <text x="68" y="280" font-size="20" fill="#91a6c1">主动检索 · 原文回读 · 证据组织 · 可复现实验</text>
  <g font-size="17" fill="#b4c6e1">
    <rect x="67" y="328" width="136" height="37" rx="18" fill="#223550" stroke="#36516d"/><text x="135" y="353" text-anchor="middle">Grep + RAG</text>
    <rect x="216" y="328" width="160" height="37" rx="18" fill="#223550" stroke="#36516d"/><text x="296" y="353" text-anchor="middle">Qwen3.5-27B</text>
    <rect x="389" y="328" width="191" height="37" rx="18" fill="#223550" stroke="#36516d"/><text x="484" y="353" text-anchor="middle">Evidence by line</text>
  </g>
  <path d="M985 119V319" fill="none" stroke="#547da0" stroke-width="2" stroke-dasharray="4 7"/>
  <g>
    <rect x="1018" y="65" width="500" height="91" rx="15" fill="#1d324d" stroke="#38506d"/>
    <circle cx="985" cy="110" r="18" fill="#203e51" stroke="#75dfd0"/>
    <text x="985" y="116" font-size="16" font-weight="700" text-anchor="middle" fill="#91eddb">1</text>
    <text x="1045" y="103" font-size="19" font-weight="700" fill="#86e1d1">SEARCH</text>
    <text x="1045" y="133" font-size="19" class="mono" fill="#c3d3e9">sources_search → relevant passages</text>
    <rect x="1018" y="175" width="500" height="91" rx="15" fill="#1d324d" stroke="#38506d"/>
    <circle cx="985" cy="220" r="18" fill="#203e51" stroke="#8faaff"/>
    <text x="985" y="226" font-size="16" font-weight="700" text-anchor="middle" fill="#b3c4ff">2</text>
    <text x="1045" y="213" font-size="19" font-weight="700" fill="#a6baff">READ</text>
    <text x="1045" y="243" font-size="19" class="mono" fill="#c3d3e9">sources_read → traceable evidence</text>
    <rect x="1018" y="285" width="500" height="91" rx="15" fill="#1d324d" stroke="#38506d"/>
    <circle cx="985" cy="330" r="18" fill="#203e51" stroke="#d7bd86"/>
    <text x="985" y="336" font-size="16" font-weight="700" text-anchor="middle" fill="#e7cf9c">3</text>
    <text x="1045" y="323" font-size="19" font-weight="700" fill="#d9c18e">SYNTHESIZE</text>
    <text x="1045" y="353" font-size="19" class="mono" fill="#c3d3e9">finish_report → cited conclusions</text>
  </g>
</svg>
