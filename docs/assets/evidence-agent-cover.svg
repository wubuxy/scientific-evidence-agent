<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
<title id="title">Scientific Evidence Agent</title><desc id="desc">An auditable research loop: requirements, search, read, field state, bounded repair and cited reports.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#243d36" stroke-width=".6"/></pattern></defs>
<rect width="1280" height="430" rx="20" fill="#102b24"/><rect width="1280" height="430" rx="20" fill="url(#grid)"/>
<g font-family="Segoe UI,Arial,sans-serif"><rect x="52" y="43" width="218" height="27" rx="13.5" fill="#244b3e"/><circle cx="68" cy="57" r="4" fill="#a7d6ac"/><text x="81" y="61" font-size="11" letter-spacing="1.8" fill="#d4e8dc">RESEARCH • WITH RECEIPTS</text>
<text x="52" y="134" font-size="46" font-weight="650" letter-spacing="-1.5" fill="#f6faf5">Scientific Evidence Agent</text>
<text x="55" y="178" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" fill="#c0d5ca">每个研究问题，都有证据与去向。</text>
<text x="55" y="215" font-size="15" fill="#a5bdb0">Plan the work. Read the source. Keep the evidence. Know what remains.</text>
<path d="M55 262H1225" stroke="#355348"/>
<g font-size="12" fill="#a9c5b4" letter-spacing="1.5"><text x="55" y="298">01 / REQUIREMENTS</text><text x="362" y="298">02 / EVIDENCE</text><text x="668" y="298">03 / FIELD STATE</text><text x="975" y="298">04 / DELIVERY</text></g>
<g font-family="Microsoft YaHei,Arial,sans-serif" font-size="18" fill="#f1f6ec"><text x="55" y="334">固定论文与回答字段</text><text x="362" y="334">搜索定位 · 按行回读</text><text x="668" y="334">追踪缺口 · 有界补读</text><text x="975" y="334">引用报告 · 明示未核实</text></g>
<g font-size="12" fill="#9ab4a5"><text x="55" y="365">Preserved requirements</text><text x="362" y="365">Source + lines + evidence ID</text><text x="668" y="365">Versioned candidates</text><text x="975" y="365">Execution ≠ semantic success</text></g>
