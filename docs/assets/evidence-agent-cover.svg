<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Scientific Evidence Agent — 研序</title>
  <desc id="desc">Research with a trace. A conceptual diagram connects paper lines to evidence and versioned fields. Missing evidence remains visible.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1720"/><stop offset="1" stop-color="#102d2b"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#40bda3" stop-opacity=".17"/><stop offset="1" stop-color="#40bda3" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#426c6a" stroke-opacity=".18" stroke-width=".7"/></pattern>
  </defs>
  <rect width="1280" height="440" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="20" fill="url(#grid)"/>
  <ellipse cx="1000" cy="170" rx="350" ry="310" fill="url(#glow)"/>
  <g font-family="Segoe UI,Arial,Microsoft YaHei,sans-serif">
    <rect x="48" y="36" width="199" height="26" rx="13" fill="#153a36" stroke="#2d5a50"/>
    <circle cx="64" cy="49" r="3.5" fill="#a4edbe"/>
    <text x="76" y="53" fill="#b8dbcb" font-size="10" letter-spacing="1.6">RESEARCH WITH A TRACE</text>
    <text x="48" y="132" fill="#edf5f3" font-size="59" font-weight="650" letter-spacing="-2">Scientific</text>
    <text x="48" y="196" fill="#edf5f3" font-size="59" font-weight="650" letter-spacing="-2">Evidence Agent<tspan fill="#a8d6ba">.</tspan></text>
    <text x="51" y="247" fill="#b6cdc7" font-size="23">每个研究问题，都有证据与去向。</text>
    <text x="51" y="284" fill="#8faaa5" font-size="14">Read the source. Trace the answer. Keep the gaps visible.</text>
    <path d="M48 337H1232" stroke="#294840"/>
    <g fill="#d1e3da" font-size="12"><text x="49" y="374">01 <tspan dx="10" fill="#96b3a8">REQUIREMENTS</tspan></text><text x="360" y="374">02 <tspan dx="10" fill="#96b3a8">SOURCE LINES</tspan></text><text x="671" y="374">03 <tspan dx="10" fill="#96b3a8">FIELD STATE</tspan></text><text x="985" y="374">04 <tspan dx="10" fill="#96b3a8">CITED REPORT</tspan></text></g>
    <g fill="#c3d8cd" font-size="14"><text x="49" y="401">固定研究要求</text><text x="360" y="401">实际回读原文</text><text x="671" y="401">跟踪版本与缺口</text><text x="985" y="401">交付引用与未核实项</text></g>
    <g transform="translate(750 36)">
      <text x="0" y="12" fill="#739b90" font-size="10" letter-spacing="2">THE EVIDENCE PATH / CONCEPT</text>
      <g transform="translate(0 38)">
        <rect x="0" y="0" width="184" height="150" rx="9" fill="#132a30" stroke="#365454"/>
        <text x="16" y="25" fill="#a7c6c0" font-size="10" letter-spacing="1">PAPER / READ WINDOW</text>
        <path d="M15 40H168" stroke="#2d484b"/>
        <g font-family="Consolas,monospace" font-size="10" fill="#6b8e88"><text x="16" y="61">L12</text><text x="16" y="84">L13</text><text x="16" y="107">L14</text><text x="16" y="130">L15</text></g>
        <g stroke-linecap="round" stroke-width="4"><path d="M48 58H144M48 127H125" stroke="#365356"/><path d="M48 81H159M48 104H135" stroke="#91bfa6"/></g>
      </g>
      <path d="M184 115H217V93H247M217 115V191H247" fill="none" stroke="#609d87" stroke-width="1.5"/>
      <circle cx="217" cy="115" r="4" fill="#b9dba4"/>
      <g transform="translate(248 50)">
        <rect width="231" height="80" rx="9" fill="#152f31" stroke="#3f6b5c"/>
        <text x="15" y="23" font-size="10" fill="#9ec6b3" letter-spacing="1">FIELD / CANDIDATE</text>
        <text x="15" y="48" font-size="15" fill="#e2ede2">答案 + evidence ID</text>
        <text x="15" y="65" font-size="10" fill="#77998b">version-bound · review pending</text>
      </g>
      <g transform="translate(248 151)">
        <rect width="231" height="80" rx="9" fill="#2a3028" stroke="#776a48"/>
        <text x="15" y="23" font-size="10" fill="#c9b67e" letter-spacing="1">FIELD / UNRESOLVED</text>
        <text x="15" y="49" font-size="15" fill="#e3d9b8">缺少依据，保留未核实</text>
        <text x="15" y="65" font-size="10" fill="#a19778">bounded repair · explicit stop</text>
      </g>
      <text x="0" y="269" font-size="11" fill="#84a195">An auditable process. A provisional answer.</text>
    </g>
  </g>
</svg>
