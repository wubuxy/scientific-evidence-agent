  <g id="text_18">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #465361" transform="translate(34.56 76.085312)">Macro F1: higher is better. False support: lower is better.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #465361" transform="translate(34.56 92.585312)">Thick bars: 95% intervals. Thin bars: Bonferroni-adjusted 98.75% intervals.</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #465361" transform="translate(34.56 397.399375)">128 claim–document pairs / 103 connected groups / 3 training seeds / 5,000 paired group resamples</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #465361" transform="translate(34.56 413.399375)">Observed development data. Proposal labels have not received independent human adjudication.</text>
